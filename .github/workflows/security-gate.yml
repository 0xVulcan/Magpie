name: Security Gate

on:
  push:
  pull_request:

permissions:
  contents: read
  # gitleaks-action lists the PR's commits on pull_request runs (GET /pulls/{n}/commits), which needs this.
  pull-requests: read

# Actions are pinned to commit SHAs (tag in the comment) so a moved tag cannot change what runs here.
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified,unknown

  forbidden-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Block databases, env files, signing material and release binaries
        run: |
          BAD=$(git ls-files | grep -Ei '\.(db|sqlite|sqlite3|pcap|pcapng|har|log|pem|key|p8|p12|pfx|cer|mobileprovision|provisionprofile|dmg|pkg|exe|ipa|xpi|crx)$|(^|/)\.env(\.|$)|(^|/)data/|(^|/)(build|dist)/' | grep -v '^\.env\.example$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::These files must not be tracked:"
            echo "$BAD"
            exit 1
          fi
          echo "No forbidden files tracked."
